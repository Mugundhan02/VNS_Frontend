@if (isLoggedIn()) {
  <div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen()">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-icon">🏗️</span>
          <span class="logo-text">VNS Build</span>
        </div>
        <button class="btn btn-ghost btn-icon sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">
        @for (item of visibleNavItems(); track item.route) {
          <a class="nav-item" [routerLink]="item.route" routerLinkActive="active" [title]="item.label">
            <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">{{ auth.currentUser()?.userName?.charAt(0)?.toUpperCase() }}</div>
          <div class="user-details">
            <div class="user-name">{{ auth.currentUser()?.userName }}</div>
            <div class="user-role">{{ auth.currentUser()?.role }}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-icon" (click)="logout()" title="Sign out" aria-label="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main area -->
    <div class="main-wrapper">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-company">{{ auth.currentUser()?.companyName }}</div>
      </header>
      <main class="main-content">
        <router-outlet />
      </main>
    </div>

  </div>
} @else {
  <router-outlet />
}
